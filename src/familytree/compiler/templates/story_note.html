<TABLE BORDER="0" CELLBORDER="1" CELLSPACING="0" CELLPADDING="2"
       BGCOLOR="{{ theme.note_bg }}"
       COLOR="{{ theme.note_border }}">
  <TR>
    <TD ALIGN="LEFT" BGCOLOR="{{ theme.note_header_bg }}" BORDER="1" CELLPADDING="2">
      <FONT POINT-SIZE="10" COLOR="{{ theme.text_primary }}"><B>{{ note.title }}</B></FONT>
    </TD>
  </TR>
  {%- for line in body_lines %}
  <TR>
    <TD ALIGN="LEFT" BORDER="0" CELLPADDING="0">
      {% if loop.first %}<FONT POINT-SIZE="2"><BR ALIGN="LEFT"/></FONT>{% endif %}
      <FONT POINT-SIZE="9" COLOR="{{ theme.text_primary }}">{{ line }}</FONT>
    </TD>
  </TR>
  {%- endfor -%}
</TABLE>
