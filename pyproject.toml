[project]
name = "familytree"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthew Pugh", email = "pughmds@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "jinja2>=3.1.6",
    "nicegui>=4.0.0",
    "pyqt6>=6.12.1",
    "pyqt6-webengine>=6.140.1",
    "pywebview>=6.2.1",
    "qtpy>=2.4.3",
    "sqlmodel>=0.0.50",
    "typer>=0.29.1",
]

[project.scripts]
familytree = "familytree.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familytree"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
